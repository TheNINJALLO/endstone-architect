[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-architect"
version = "1.0.16"
description = "Tag-gated and team-based architect build zones for Minecraft Bedrock"
requires-python = ">=3.10"
dependencies = [
    "endstone>=0.11.8,<0.12",
    "flask>=3.0"
]

[project.entry-points."endstone"]
architect = "endstone_architect.plugin:ArchitectPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_architect"]
